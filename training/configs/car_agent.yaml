behaviors:
  RunnerAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    init_path: results/run4/RunnerAgent/RunnerAgent-5362050.pt
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5


  PoliceAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # SELF-PLAY: PoliceAgent trains against improving versions of itself
    self_play:
      save_steps: 50000           # Guarda checkpoint cada 50k steps
      swap_steps: 50000           # Cambia adversario cada 50k steps
      play_against_latest_model_ratio: 0.5  # 50% vs modelo actual, 50% vs antiguos
      initial_elo: 1200.0         # Rating Elo inicial (métrica de skill)
    init_path: results/run15/PoliceAgent/PoliceAgent-536377.pt
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
    threaded: false
    keep_checkpoints: 10

env_settings:
  env_path: null
  base_port: 5005
  num_envs: 1
  num_areas: 1
  seed: -1
